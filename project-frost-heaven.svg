<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseBerry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <linearGradient id="chocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#271005"/>
    </linearGradient>
    <linearGradient id="pinkVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Subtle Bakery Glow Background Orbs -->
  <circle cx="150" cy="180" r="140" fill="#f59e0b" opacity="0.04"/>
  <circle cx="820" cy="380" r="160" fill="#f43f5e" opacity="0.04"/>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <rect x="0" y="0" width="960" height="54" fill="#0f1520" opacity="0.95"/>
  <line x1="0" y1="54" x2="960" y2="54" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Bakery Logo -->
  <g transform="translate(28, 13)">
    <rect width="28" height="28" rx="7" fill="url(#goldAmber)"/>
    <!-- Cake icon SVG in logo -->
    <path d="M7 21h14v-4H7v4zm1-6h12v-3H8v3zm2-5h8V7h-8v3zm4-5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill="#1e1b4b"/>
    <text x="36" y="19" class="font-title" font-size="16" fill="#f8fafc" letter-spacing="0.5">Frost Heaven</text>
    <text x="135" y="14" class="font-mono" font-size="8" fill="#f59e0b" letter-spacing="1">ARTISAN BAKERY</text>
  </g>

  <!-- Navigation Menu Links -->
  <g transform="translate(285, 32)" class="font-body" font-size="12" fill="#94a3b8" font-weight="500">
    <text x="0" y="0" fill="#f59e0b" font-weight="600">Custom Cake Builder</text>
    <text x="140" y="0">Celebration Cakes</text>
    <text x="260" y="0">Pastries &amp; Cupcakes</text>
    <text x="395" y="0">Delivery Scheduler</text>
  </g>

  <!-- Right Actions: Search & Cart -->
  <g transform="translate(805, 12)">
    <rect width="128" height="30" rx="15" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
    <!-- Shopping bag icon -->
    <path d="M16 11h-2a3 3 0 00-6 0H6a1 1 0 00-1 1l1 10a1 1 0 001 1h10a1 1 0 001-1l1-10a1 1 0 00-1-1zm-5-2a1 1 0 012 0v2h-2V9z" fill="#f59e0b" transform="translate(10, 4) scale(0.8)"/>
    <text x="32" y="20" class="font-mono" font-size="11" font-weight="600" fill="#f59e0b">Cart (2) · $98</text>
  </g>

  <!-- ================= SUB-HEADER PROMO BANNER ================= -->
  <g transform="translate(28, 66)">
    <rect width="904" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="18" y="26" class="font-body" font-size="12" fill="#f8fafc" font-weight="600">🎂 Custom Cake Studio:</text>
    <text x="156" y="26" class="font-body" font-size="12" fill="#94a3b8">Handcraft your celebration cake with custom sponges, fillings &amp; message piping. Same-day baking &amp; dispatch.</text>
    <rect x="790" y="9" width="98" height="24" rx="6" fill="url(#goldAmber)"/>
    <text x="806" y="25" class="font-title" font-size="10" font-weight="700" fill="#0f172a">ORDER NOW →</text>
  </g>

  <!-- ================= 3-COLUMN STOREFRONT SHOWCASE ================= -->

  <!-- CARD 1: CUSTOM CAKE BUILDER WIDGET -->
  <g transform="translate(28, 120)" filter="url(#cardShadow)">
    <rect width="310" height="360" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="310" height="40" rx="14" fill="rgba(245, 158, 11, 0.08)"/>
    <circle cx="20" cy="20" r="5" fill="#f59e0b"/>
    <text x="34" y="24" class="font-title" font-size="13" fill="#f8fafc">Interactive Cake Builder</text>
    <text x="238" y="24" class="font-mono" font-size="10" fill="#f59e0b">STEP 1 TO 3</text>
    <line x1="0" y1="40" x2="310" y2="40" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Option 1: Base Flavor -->
    <text x="16" y="64" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">1. SELECT SPONGE BASE</text>
    <!-- Flavor Pills -->
    <g transform="translate(16, 73)">
      <rect width="86" height="26" rx="6" fill="url(#goldAmber)"/>
      <text x="12" y="17" class="font-body" font-size="10.5" font-weight="700" fill="#0f172a">✓ Dark Choc</text>

      <rect x="92" y="0" width="86" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="106" y="17" class="font-body" font-size="10" fill="#cbd5e1">Red Velvet</text>

      <rect x="184" y="0" width="86" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="198" y="17" class="font-body" font-size="10" fill="#cbd5e1">Vanilla Bean</text>
    </g>

    <!-- Option 2: Filling & Ganache -->
    <text x="16" y="124" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">2. ARTISAN FILLING &amp; GANACHE</text>
    <g transform="translate(16, 133)">
      <rect width="134" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="17" class="font-body" font-size="10" font-weight="600" fill="#fcd34d">✓ Salted Caramel Ganache</text>

      <rect x="140" y="0" width="134" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="150" y="17" class="font-body" font-size="10" fill="#cbd5e1">Raspberry Coulis</text>
    </g>

    <!-- Option 3: Size / Tiers -->
    <text x="16" y="184" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">3. SIZE &amp; CELEBRATION TIERS</text>
    <g transform="translate(16, 193)">
      <rect width="134" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="14" y="16" class="font-body" font-size="10" fill="#cbd5e1">1-Tier (8" • 10-12 Serves)</text>

      <rect x="140" y="0" width="134" height="24" rx="6" fill="url(#goldAmber)"/>
      <text x="148" y="16" class="font-body" font-size="10" font-weight="700" fill="#0f172a">✓ 2-Tier (Serves 25)</text>
    </g>

    <!-- Fondant Message Input Field -->
    <text x="16" y="240" class="font-mono" font-size="10" fill="#94a3b8" letter-spacing="0.5">CUSTOM MESSAGE PIPED ON CAKE</text>
    <rect x="16" y="248" width="278" height="30" rx="6" fill="#0b0f17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="26" y="268" class="font-body" font-size="11" fill="#f8fafc" font-style="italic">"Happy 21st Birthday Chamalka!"</text>

    <!-- Delivery Date Slot -->
    <g transform="translate(16, 288)">
      <rect width="278" height="24" rx="5" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="10" y="16" class="font-body" font-size="10" fill="#10b981">📅 Delivery Slot: Tomorrow, 2:00 PM – 4:00 PM</text>
    </g>

    <!-- Bottom Price & Order Button -->
    <line x1="0" y1="322" x2="310" y2="322" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="18" y="347" class="font-mono" font-size="16" font-weight="700" fill="#f8fafc">$78.00</text>
    <rect x="165" y="328" width="130" height="26" rx="6" fill="url(#goldAmber)"/>
    <text x="178" y="345" class="font-title" font-size="10.5" font-weight="700" fill="#0f172a">+ ADD TO BAKERY CART</text>
  </g>

  <!-- CARD 2: SIGNATURE MIDNIGHT CHOCOLATE TRUFFLE CAKE -->
  <g transform="translate(352, 120)" filter="url(#cardShadow)">
    <rect width="280" height="360" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Cake Visual Illustration Box -->
    <rect x="14" y="14" width="252" height="155" rx="10" fill="url(#chocGrad)"/>
    
    <!-- Vector Cake Illustration -->
    <g transform="translate(70, 25)">
      <!-- Cake Stand Base -->
      <path d="M40 120 L100 120 L95 132 L45 132 Z" fill="#94a3b8" opacity="0.6"/>
      <ellipse cx="70" cy="118" rx="55" ry="12" fill="#cbd5e1" opacity="0.8"/>

      <!-- Cake Tier 1 (Bottom) -->
      <rect x="25" y="65" width="90" height="42" rx="4" fill="#381a08"/>
      <ellipse cx="70" cy="65" rx="45" ry="10" fill="#52250d"/>
      <ellipse cx="70" cy="107" rx="45" ry="10" fill="#291205"/>

      <!-- Cake Tier 2 (Top) -->
      <rect x="40" y="32" width="60" height="34" rx="3" fill="#421f0b"/>
      <ellipse cx="70" cy="32" rx="30" ry="7" fill="#653013"/>
      <ellipse cx="70" cy="66" rx="30" ry="7" fill="#321607"/>

      <!-- Chocolate Drip Effects -->
      <path d="M40 38 Q45 48 50 38 Q55 52 60 38 Q65 46 70 38 Q75 50 80 38 Q85 45 90 38 Q95 50 100 38" stroke="#1f0c03" stroke-width="3" fill="none"/>
      <path d="M25 72 Q35 84 45 72 Q55 88 65 72 Q75 86 85 72 Q95 85 105 72 Q110 82 115 72" stroke="#1f0c03" stroke-width="4" fill="none"/>

      <!-- Berry & Gold Leaf Toppings on Cake -->
      <circle cx="64" cy="28" r="5" fill="#e11d48"/>
      <circle cx="74" cy="27" r="4.5" fill="#881337"/>
      <circle cx="70" cy="23" r="4" fill="#be123c"/>
      <!-- Gold flake -->
      <circle cx="67" cy="25" r="1.5" fill="#fef08a"/>
      <circle cx="78" cy="30" r="1" fill="#fef08a"/>
    </g>

    <!-- Badge: Handcrafted Bestseller -->
    <rect x="24" y="24" width="92" height="20" rx="10" fill="rgba(15,23,42,0.85)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="38" class="font-mono" font-size="9" font-weight="600" fill="#f59e0b">★ BEST SELLER</text>

    <!-- Product Details -->
    <text x="18" y="195" class="font-title" font-size="14" fill="#f8fafc">Midnight Chocolate Truffle</text>
    <text x="18" y="212" class="font-body" font-size="11" fill="#94a3b8">70% Valrhona dark ganache, cocoa crumble</text>

    <!-- Dietary & Flavor Tags -->
    <g transform="translate(18, 222)">
      <rect width="66" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="8" y="13" class="font-mono" font-size="9" fill="#cbd5e1">Triple Choc</text>

      <rect x="72" y="0" width="60" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="80" y="13" class="font-mono" font-size="9" fill="#cbd5e1">Eggless Opt</text>

      <rect x="138" y="0" width="56" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="144" y="13" class="font-mono" font-size="9" fill="#f59e0b">★ 4.9 (128)</text>
    </g>

    <!-- Cake Specs -->
    <text x="18" y="260" class="font-body" font-size="10.5" fill="#64748b">Serving: 8-10 Guests • Weight: 1.2 kg</text>
    <text x="18" y="278" class="font-body" font-size="10.5" fill="#10b981">✓ Available for today's pickup / delivery</text>

    <!-- Bottom Action -->
    <line x1="0" y1="305" x2="280" y2="305" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="18" y="337" class="font-mono" font-size="16" font-weight="700" fill="#f8fafc">$48.00</text>
    <rect x="155" y="320" width="110" height="28" rx="6" fill="url(#goldAmber)"/>
    <text x="172" y="338" class="font-title" font-size="11" font-weight="700" fill="#0f172a">QUICK ORDER</text>
  </g>

  <!-- CARD 3: WILD BERRY VELVET CHEESECAKE -->
  <g transform="translate(650, 120)" filter="url(#cardShadow)">
    <rect width="282" height="360" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Cake Visual Illustration Box -->
    <rect x="14" y="14" width="254" height="155" rx="10" fill="url(#pinkVelvet)"/>

    <!-- Vector Cheesecake Illustration -->
    <g transform="translate(70, 25)">
      <!-- Stand -->
      <path d="M40 120 L100 120 L95 132 L45 132 Z" fill="#94a3b8" opacity="0.6"/>
      <ellipse cx="70" cy="118" rx="55" ry="12" fill="#cbd5e1" opacity="0.8"/>

      <!-- Biscuit Crust Base -->
      <rect x="25" y="85" width="90" height="22" rx="3" fill="#b45309"/>
      <ellipse cx="70" cy="107" rx="45" ry="8" fill="#92400e"/>

      <!-- Baked Cream Cheese Layer -->
      <rect x="25" y="50" width="90" height="38" rx="3" fill="#fff1f2"/>
      <ellipse cx="70" cy="50" rx="45" ry="10" fill="#ffffff"/>

      <!-- Glossy Strawberry Coulis Glaze Layer -->
      <ellipse cx="70" cy="51" rx="44" ry="9.5" fill="#e11d48" opacity="0.85"/>

      <!-- Berry Toppings -->
      <circle cx="55" cy="48" r="6" fill="#be123c"/>
      <circle cx="68" cy="46" r="5" fill="#881337"/>
      <circle cx="82" cy="48" r="5.5" fill="#be123c"/>
      <circle cx="62" cy="43" r="4.5" fill="#9f1239"/>
      <circle cx="75" cy="42" r="5" fill="#e11d48"/>
      <!-- Mint leaf -->
      <path d="M68 38 Q74 32 80 37 Q75 42 68 38 Z" fill="#15803d"/>
    </g>

    <!-- Badge: Seasonal Fresh -->
    <rect x="24" y="24" width="94" height="20" rx="10" fill="rgba(15,23,42,0.85)" stroke="#fb7185" stroke-width="1"/>
    <text x="32" y="38" class="font-mono" font-size="9" font-weight="600" fill="#fb7185">🌸 FRESH SEASONAL</text>

    <!-- Product Details -->
    <text x="18" y="195" class="font-title" font-size="14" fill="#f8fafc">Wild Berry Velvet Cheesecake</text>
    <text x="18" y="212" class="font-body" font-size="11" fill="#94a3b8">Graham crust, Philadelphia cheese, berry glaze</text>

    <!-- Dietary & Flavor Tags -->
    <g transform="translate(18, 222)">
      <rect width="68" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="8" y="13" class="font-mono" font-size="9" fill="#cbd5e1">Madagascan</text>

      <rect x="74" y="0" width="58" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="82" y="13" class="font-mono" font-size="9" fill="#cbd5e1">Fresh Fruit</text>

      <rect x="138" y="0" width="56" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
      <text x="144" y="13" class="font-mono" font-size="9" fill="#fb7185">★ 5.0 (94)</text>
    </g>

    <!-- Cake Specs -->
    <text x="18" y="260" class="font-body" font-size="10.5" fill="#64748b">Serving: 10-12 Guests • Weight: 1.4 kg</text>
    <text x="18" y="278" class="font-body" font-size="10.5" fill="#10b981">✓ Express 2-Hour Delivery Slot Available</text>

    <!-- Bottom Action -->
    <line x1="0" y1="305" x2="282" y2="305" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="18" y="337" class="font-mono" font-size="16" font-weight="700" fill="#f8fafc">$54.00</text>
    <rect x="156" y="320" width="112" height="28" rx="6" fill="url(#roseBerry)"/>
    <text x="174" y="338" class="font-title" font-size="11" font-weight="700" fill="#ffffff">QUICK ORDER</text>
  </g>

  <!-- ================= BOTTOM BAKERY OPERATIONS STATUS BAR ================= -->
  <g transform="translate(28, 496)">
    <rect width="904" height="32" rx="8" fill="#0f1520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="20" class="font-mono" font-size="10" fill="#94a3b8">
      <tspan fill="#10b981" font-weight="600">BAKERY SYSTEM LIVE: </tspan>
      14 Custom Orders in Oven · 8 Scheduled for Afternoon Dispatch · Pastry Inventory Auto-Sync Active (PostgreSQL / NestJS)
    </text>
    <text x="785" y="20" class="font-mono" font-size="10" fill="#f59e0b">SC-FROST HEAVEN PLATFORM</text>
  </g>
</svg>
